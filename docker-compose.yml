version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: playnex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playnex_db
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: playnex-pgweb
    restart: unless-stopped
    ports:
      - '8085:8081'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/playnex_db?sslmode=disable
    depends_on:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: playnex-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
      - '5000:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@playnex.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  postgres_data:
